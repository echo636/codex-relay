name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_publication.py --tracked
      - run: python scripts/check_i18n.py
      - run: python scripts/vendor_assets.py --verify
      - run: python -m unittest discover -s tests
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python scripts/check_browser.py
      - run: python -m build --no-isolation
      - run: python scripts/check_wheel.py
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan full Git history
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o scanner.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz" | sha256sum --check
          tar -xzf scanner.tar.gz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
